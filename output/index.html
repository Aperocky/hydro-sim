<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Rocky Li">

    <title>HydroSim</title>

    <!-- Bootstrap core CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom styles for this template -->
    <style type="text/css">
        body {
            background: #ddd;
            margin: 0;
            padding: 0;
            min-height: 100%;
        }
        #mebody {
            min-height: 90vh;
            min-width: 100%;
        }
        footer {
            min-height: 10vh;
        }
        .sig {
            padding: 10px;
        }
        .ubscript {
            max-height: 20px;
        }
        .inlineb {
            display: inline-block;
            margin: 10px;
        }
        #controlPanel {
            max-height: calc(100vh - 20px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .info-panel-row {
            flex: 1 1 auto;
            min-height: 0;
        }
        #console {
            color: #edf2f7;
            padding: 14px;
            width: 100%;
            height: 100%;
            min-height: 180px;
            background: #1f242a;
            border-radius: 8px;
            border: 1px solid #3b4652;
            overflow-y: auto;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-content: start;
            gap: 10px;
        }
        .info-title {
            grid-column: 1 / -1;
            margin: 0;
            font-size: 18px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: 0;
        }
        .info-section {
            padding: 9px;
            border: 1px solid #39424c;
            border-radius: 6px;
            min-width: 0;
        }
        .info-section-title {
            margin: 0 0 8px;
            color: #aebccc;
            font-size: 12px;
            line-height: 1.2;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0;
        }
        .info-rows {
            display: grid;
            gap: 5px;
        }
        .info-row {
            display: grid;
            grid-template-columns: minmax(104px, 48%) minmax(0, 1fr);
            gap: 8px;
            align-items: start;
            font-size: 12px;
            line-height: 1.25;
        }
        .info-label {
            color: #94a3b8;
        }
        .info-value {
            color: #f8fafc;
            overflow-wrap: anywhere;
            text-align: right;
        }
        .info-line {
            color: #edf2f7;
            margin: 0;
            font-size: 13px;
        }
        @media (max-width: 767px) {
            #controlPanel {
                max-height: none;
                overflow: visible;
            }
            #console {
                height: 42vh;
                min-height: 260px;
                margin-top: 8px;
                grid-template-columns: 1fr;
            }
            .info-row {
                grid-template-columns: 1fr;
                gap: 2px;
            }
            .info-value {
                text-align: left;
            }
        }
    </style>
</head>

<body>
<div class="container" id="mebody">
    <div class="row sig">
        <div class="col-md-8" id="mapspace">
        </div>
        <div class="col-md-4" id="controlPanel">
            <div class="row ubscript">
                <p class='text-muted'>Global Actions &emsp;&emsp;<a href="https://github.com/aperocky/hydro-sim">Source Code</a></p>
            </div>
            <div class="row">
                <button type="button" class="btn btn-info inlineb" id="reload">RELOAD</button>
                <button type="button" class="btn btn-info inlineb" id="run">NEXT YEAR</button>
                <button type="button" class="btn btn-info inlineb" id="decade">DECADE</button>
            </div>
            <div class="row ubscript">
                <p class='text-muted'>Display Actions</p>
            </div>
            <div class="row">
                <button type="button" class="btn btn-info inlineb" id="show_alt">ALTITUDE</button>
                <button type="button" class="btn btn-info inlineb" id="show_precip">PRECIP</button>
                <button type="button" class="btn btn-info inlineb" id="show_basin">BASIN</button>
                <button type="button" class="btn btn-info inlineb" id="show_aquifer">AQUIFER</button>
                <button type="button" class="btn btn-info inlineb" id="show_flora">BIOME</button>
                <button type="button" class="btn btn-info inlineb" id="flora_alpha">BIOME<sup>ALPHA</sup></button>
                <button type="button" class="btn btn-info inlineb" id="show_flatness">FLATNESS</button>
            </div>
            <div class="row ubscript">
                <p class='text-muted'>Climate Change</p>
            </div>
            <div class="row">
                <button type="button" class="btn btn-info inlineb" id="dry_spell">DRY</button>
                <button type="button" class="btn btn-info inlineb" id="wet_spell">WET</button>
                <button type="button" class="btn btn-info inlineb" id="shift_spell">SHIFT</button>
                <button type="button" class="btn btn-danger inlineb" id="earthquake">QUAKE</button>
            </div>
            <div class="row">
                <p class='text-muted'>Information Panel</p>
            </div>
            <div class="row info-panel-row">
                <div id='console'>
                </div>
            </div>
        </div>
    </div>
</div>
<footer class="py-5 bg-dark">
    <div class="container">
        <p class="m-0 text-center text-white">Copyright &copy; Rocky Li</p>
    </div>
</footer>
</body>
    <script src="script.js"></script>
</html>
