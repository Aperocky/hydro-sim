<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Rocky Li">

    <title>HydroSim</title>

    <!-- Bootstrap core CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom styles for this template -->
    <style type="text/css">
        body {
            background: #ddd;
            margin: 0;
            padding: 0;
            min-height: 100%;
        }
        #mebody {
            min-height: 90vh;
            min-width: 100%;
        }
        footer {
            min-height: 10vh;
        }
        .sig {
            padding: 10px;
        }
        .ubscript {
            max-height: 20px;
        }
        .inlineb {
            display: inline-block;
            margin: 10px;
        }
        #mapspace {
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }
        #mapspace canvas {
            display: block;
            max-width: none;
        }
        #controlPanel {
            display: flex;
            flex-direction: column;
        }
        .info-panel-row {
            flex: 0 0 auto;
        }
        #console {
            color: #25313f;
            padding: 0;
            width: 100%;
            min-height: 180px;
            background: transparent;
            border-radius: 0;
            border: 0;
            overflow: visible;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-content: start;
            gap: 10px;
        }
        .info-title {
            grid-column: 1 / -1;
            margin: 0 0 2px;
            color: #6c757d;
            font-size: 13px;
            line-height: 1.2;
            font-weight: 600;
            letter-spacing: 0;
        }
        .info-section {
            padding: 8px;
            border: 0;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.32);
            min-width: 0;
        }
        .info-section-title {
            margin: 0 0 7px;
            color: #6c757d;
            font-size: 12px;
            line-height: 1.2;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0;
        }
        .info-metrics {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
        }
        .info-metric {
            min-height: 42px;
            padding: 5px 7px;
            background: rgba(255, 255, 255, 0.58);
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.15;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
        }
        .info-label {
            color: #5f6b78;
            white-space: nowrap;
            font-size: 11px;
            line-height: 1.1;
        }
        .info-value {
            color: #1f2933;
            overflow-wrap: anywhere;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            line-height: 1.15;
        }
        .info-metric:first-child .info-value {
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .info-line {
            grid-column: 1 / -1;
            color: #25313f;
            margin: 0;
            font-size: 13px;
        }
        @media (max-width: 767px) {
            .sig {
                padding: 6px;
            }
            #mapspace {
                max-height: 70vh;
                margin-bottom: 12px;
                border: 1px solid rgba(0,0,0,0.12);
                background: #cfd3d7;
            }
            #controlPanel {
                overflow: visible;
            }
            .inlineb {
                margin: 5px;
            }
            #console {
                min-height: 260px;
                margin-top: 8px;
                grid-template-columns: 1fr;
            }
            .info-metrics {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div class="container" id="mebody">
    <div class="row sig">
        <div class="col-md-8" id="mapspace">
        </div>
        <div class="col-md-4" id="controlPanel">
            <div class="row ubscript">
                <p class='text-muted'>Global Actions &emsp;&emsp;<a href="https://github.com/aperocky/hydro-sim">Source Code</a></p>
            </div>
            <div class="row">
                <button type="button" class="btn btn-info inlineb" id="reload">RELOAD</button>
                <button type="button" class="btn btn-info inlineb" id="run">NEXT YEAR</button>
                <button type="button" class="btn btn-info inlineb" id="decade">DECADE</button>
            </div>
            <div class="row ubscript">
                <p class='text-muted'>Display Actions</p>
            </div>
            <div class="row">
                <button type="button" class="btn btn-info inlineb" id="show_alt">ALTITUDE</button>
                <button type="button" class="btn btn-info inlineb" id="show_precip">PRECIP</button>
                <button type="button" class="btn btn-info inlineb" id="show_basin">BASIN</button>
                <button type="button" class="btn btn-info inlineb" id="show_aquifer">AQUIFER</button>
                <button type="button" class="btn btn-info inlineb" id="show_flora">BIOME</button>
                <button type="button" class="btn btn-info inlineb" id="flora_alpha">BIOME<sup>ALPHA</sup></button>
                <button type="button" class="btn btn-info inlineb" id="show_flatness">FLATNESS</button>
            </div>
            <div class="row ubscript">
                <p class='text-muted'>Climate Change</p>
            </div>
            <div class="row">
                <button type="button" class="btn btn-info inlineb" id="dry_spell">DRY</button>
                <button type="button" class="btn btn-info inlineb" id="wet_spell">WET</button>
                <button type="button" class="btn btn-info inlineb" id="shift_spell">SHIFT</button>
                <button type="button" class="btn btn-danger inlineb" id="earthquake">QUAKE</button>
            </div>
            <div class="row">
                <p class='text-muted'>Information Panel</p>
            </div>
            <div class="row info-panel-row">
                <div id='console'>
                </div>
            </div>
        </div>
    </div>
</div>
<footer class="py-5 bg-dark">
    <div class="container">
        <p class="m-0 text-center text-white">Copyright &copy; Rocky Li</p>
    </div>
</footer>
</body>
    <script src="script.js"></script>
</html>
